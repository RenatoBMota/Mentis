services:
  postgres:
    image: postgres:16-alpine
    container_name: mentis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentis}
      POSTGRES_DB: ${POSTGRES_DB:-mentis}
    # Só acessível pela rede interna do Compose (api/web). Se precisar
    # conectar de fora (ex.: cliente SQL na própria VPS), isso publica
    # a porta só em loopback — nunca na interface pública.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mentis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mentis-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mentis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mentis-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Aponta para os serviços da própria rede do Compose — sobrescreve
      # qualquer DATABASE_URL/REDIS_URL "localhost" herdado do .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mentis}:${POSTGRES_PASSWORD:-mentis}@postgres:5432/${POSTGRES_DB:-mentis}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /repo/apps/api/uploads
    # Só acessível pela rede interna do Compose — em produção, o Caddy é o
    # único ponto de entrada público (portas 80/443). Ver Caddyfile.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      # Arquivos da Biblioteca Digital (criptografados) — precisam sobreviver
      # a rebuilds/redeploys do container.
      - mentis_uploads_data:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mentis-web
    restart: unless-stopped
    # Mesma lógica do api: só a rede interna do Compose acessa direto; o
    # tráfego público passa pelo Caddy.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: mentis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mentis_caddy_data:/data
      - mentis_caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  mentis_postgres_data:
  mentis_redis_data:
  mentis_uploads_data:
  mentis_caddy_data:
  mentis_caddy_config:
