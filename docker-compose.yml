services:
  postgres:
    image: postgres:16-alpine
    container_name: mentis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentis}
      POSTGRES_DB: ${POSTGRES_DB:-mentis}
    # Só acessível pela rede interna do Compose (api/web). Se precisar
    # conectar de fora (ex.: cliente SQL na própria VPS), isso publica
    # a porta só em loopback — nunca na interface pública.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mentis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mentis-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mentis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mentis-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Aponta para os serviços da própria rede do Compose — sobrescreve
      # qualquer DATABASE_URL/REDIS_URL "localhost" herdado do .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mentis}:${POSTGRES_PASSWORD:-mentis}@postgres:5432/${POSTGRES_DB:-mentis}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /repo/apps/api/uploads
    # 127.0.0.1 é só para debug local direto (curl na própria VPS) — quem
    # expõe ao público é o Traefik já existente na VPS, via rede Docker
    # compartilhada + labels abaixo (ver README, seção "Deploy em produção").
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      # Arquivos da Biblioteca Digital (criptografados) — precisam sobreviver
      # a rebuilds/redeploys do container.
      - mentis_uploads_data:/repo/apps/api/uploads
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      # Obrigatório quando o container está em mais de uma rede (aqui: a
      # interna do Compose + a do Traefik) — sem isso o Traefik pode
      # escolher a rede errada pra alcançar o container e dar Gateway Timeout.
      traefik.docker.network: "n8n_default"
      traefik.http.routers.mentis-api.rule: "Host(`mentis.renatomota.online`) && (PathPrefix(`/v1`) || PathPrefix(`/docs`))"
      traefik.http.routers.mentis-api.entrypoints: "websecure"
      traefik.http.routers.mentis-api.tls.certresolver: "mytlschallenge"
      traefik.http.routers.mentis-api.priority: "10"
      traefik.http.services.mentis-api.loadbalancer.server.port: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mentis-web
    restart: unless-stopped
    # Mesma lógica do api: 127.0.0.1 só para debug local; tráfego público
    # entra pelo Traefik existente na VPS.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "n8n_default"
      traefik.http.routers.mentis-web.rule: "Host(`mentis.renatomota.online`)"
      traefik.http.routers.mentis-web.entrypoints: "websecure"
      traefik.http.routers.mentis-web.tls.certresolver: "mytlschallenge"
      traefik.http.routers.mentis-web.priority: "1"
      traefik.http.services.mentis-web.loadbalancer.server.port: "3000"
    depends_on:
      - api

networks:
  # Rede do Traefik que já roda na VPS (stack do n8n) — precisa existir
  # antes do "docker compose up" (é criada por aquele outro stack, não por
  # este). Ver README, seção "Deploy em produção".
  traefik:
    external: true
    name: n8n_default

volumes:
  mentis_postgres_data:
  mentis_redis_data:
  mentis_uploads_data:
