services:
  postgres:
    image: postgres:16-alpine
    container_name: mentis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mentis
      POSTGRES_PASSWORD: mentis
      POSTGRES_DB: mentis
    ports:
      - "5432:5432"
    volumes:
      - mentis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mentis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mentis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mentis_postgres_data:
  mentis_redis_data:
